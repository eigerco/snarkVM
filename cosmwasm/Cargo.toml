[package]
name = "snarkvm-cosmwasm"
version = "3.8.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = [ "console" ]
console = [ "snarkvm-console" ]

[dependencies.snarkvm-console]
path = "../console"
version = "=3.8.0"
features = [ "cosmwasm" ]
optional = true

[dependencies.getrandom]
version = "0.2"
features = ["custom"]
